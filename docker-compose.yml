services:
  db:
    image: postgres:16
    container_name: volo_manager_db
    environment:
      POSTGRES_USER: volo
      POSTGRES_PASSWORD: volo123
      POSTGRES_DB: volo_manager
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U volo -d volo_manager"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: volo_manager_backend
    environment:
      DATABASE_URL: postgresql://volo:volo123@db:5432/volo_manager
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: volo_manager_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
