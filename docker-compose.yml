services:
  db:
    image: postgres:16
    container_name: volo_manager_db
    environment:
      POSTGRES_USER: volo
      POSTGRES_PASSWORD: volo123
      POSTGRES_DB: volo_manager
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: